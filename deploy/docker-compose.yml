# TurnoSala Prospector — despliegue local y VPS (design.md §10).
# Local:  docker compose -f deploy/docker-compose.yml up -d postgres web
# VPS:    docker compose -f deploy/docker-compose.yml --profile vps up -d
# En el CPD la entrada HTTPS la da el proxy existente: NO se activa el perfil "vps" (D-01).
name: turnosala-prospector

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-prospector}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    environment:
      APP_MODE: ${APP_MODE:-sandbox}
      PORT: "3000"
      # Sin valores por defecto: la aplicación se niega a arrancar si faltan (ver deploy/.env.example).
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    restart: unless-stopped
    environment:
      APP_MODE: ${APP_MODE:-sandbox}
      DATABASE_URL: ${DATABASE_URL}
      # El gasto en IA está APAGADO salvo ENRICH_ENABLED=1, y entonces exige OPENROUTER_API_KEY (ver deploy/.env.example).
      ENRICH_ENABLED: ${ENRICH_ENABLED:-0}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      CRAWLER_USER_AGENT: ${CRAWLER_USER_AGENT:-}
      OSM_ENDPOINT: ${OSM_ENDPOINT:-}
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-15000}
      WORKER_RESEARCH_TASKS: ${WORKER_RESEARCH_TASKS:-20}
      WORKER_ENRICH_BATCH: ${WORKER_ENRICH_BATCH:-5}
    depends_on:
      postgres:
        condition: service_healthy

  voice:
    profiles: ["later"]   # F5: aún sin código
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP: voice
    environment:
      APP_MODE: ${APP_MODE:-sandbox}
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    profiles: ["vps"]
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
